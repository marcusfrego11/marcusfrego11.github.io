<!DOCTYPE html>
<html lang="en">
<head>
<title>Website</title>
<body>
    <h1>Hello World</h1>
    <p>Below is a snake game for you to enjoy</p>
</body>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Snake Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #1a1a1a;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #ffffff;
            overflow: hidden;
        }
        .game-container {
            text-align: center;
            position: relative;
        }
        .scoreboard {
            display: flex;
            justify-content: space-between;
            width: 400px;
            margin-bottom: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        canvas {
            background-color: #000000;
            border: 4px solid #333333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: block;
        }
        .menu {
            position: absolute;
            top: 45px;
            left: 0;
            width: 400px;
            height: 400px;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 4px solid transparent;
        }
        .menu h1 {
            font-size: 2.5rem;
            color: #4CAF50;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
        }
        .menu button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1.1rem;
            font-family: inherit;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
        }
        .menu button:hover {
            background-color: #45a049;
        }
        .hidden {
            display: none !important;
        }
        .controls-hint {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #888888;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="scoreboard">
            <div>Score: <span id="score">0</span></div>
            <div>High Score: <span id="high-score">0</span></div>
        </div>
        
        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <!-- Start / Game Over Screen Overlay -->
        <div id="gameMenu" class="menu">
            <h1 id="menuTitle">SNAKE GAME</h1>
            <button id="startBtn" onclick="startGame()">PLAY</button>
        </div>
        
        <div class="controls-hint">Use Arrow Keys or WASD to navigate<br>&copy;2026 marcusfrego11. No rights reserved.</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('high-score');
        const gameMenu = document.getElementById('gameMenu');
        const menuTitle = document.getElementById('menuTitle');
        const startBtn = document.getElementById('startBtn');

        // Grid Configuration
        const gridSize = 20; 
        const tileCount = canvas.width / gridSize; // 20x20 grid

        // Game State Variables
        let snake = [];
        let food = { x: 0, y: 0 };
        let dx = gridSize; // Horizontal velocity
        let dy = 0;        // Vertical velocity
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameInterval = null;
        let nextDirection = { x: gridSize, y: 0 }; // Prevent 180-degree self-collision bugs

        highScoreEl.textContent = highScore;

        // Web Audio API helper for retro synth sound effects
        function playTone(freq, duration, type = 'square') {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                oscillator.type = type;
                oscillator.frequency.value = freq;
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + duration);
            } catch (e) {
                // Ignore audio restriction errors
            }
        }

        function startGame() {
            // Reset game variables
            snake = [
                { x: gridSize * 5, y: gridSize * 10 },
                { x: gridSize * 4, y: gridSize * 10 },
                { x: gridSize * 3, y: gridSize * 10 }
            ];
            dx = gridSize;
            dy = 0;
            nextDirection = { x: gridSize, y: 0 };
            score = 0;
            scoreEl.textContent = score;
            
            generateFood();
            gameMenu.classList.add('hidden');
            
            // Loop runs every 100ms (10 frames per second)
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(update, 100);
        }

        function generateFood() {
            // Position food perfectly inside grid spaces
            food.x = Math.floor(Math.random() * tileCount) * gridSize;
            food.y = Math.floor(Math.random() * tileCount) * gridSize;

            // Ensure food doesn't spawn inside the snake's body
            for (let part of snake) {
                if (part.x === food.x && part.y === food.y) {
                    generateFood();
                    break;
                }
            }
        }

        function update() {
            // Commit direction change locked during the current frame frame
            dx = nextDirection.x;
            dy = nextDirection.y;

            // Calculate next step for snake head
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Wall Collision Check
            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                gameOver();
                return;
            }

            // Self Collision Check (skip index 0)
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver();
                    return;
                }
            }

            // Insert new head at the beginning of the snake array
            snake.unshift(head);

            // Food Check
            if (head.x === food.x && head.y === food.y) {
                score++;
                scoreEl.textContent = score;
                playTone(523.25, 0.1, 'sine'); // Blip sound
                if (score > highScore) {
                    highScore = score;
                    highScoreEl.textContent = highScore;
                    localStorage.setItem('snakeHighScore', highScore);
                }
                generateFood();
            } else {
                // If no food eaten, remove the tail end to maintain moving length
                snake.pop();
            }

            draw();
        }

        function draw() {
            // Clear entire board canvas
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Snake
            snake.forEach((part, index) => {
                // Main head color vs body color accent
                ctx.fillStyle = index === 0 ? '#4CAF50' : '#81C784';
                ctx.fillRect(part.x, part.y, gridSize - 2, gridSize - 2); // 2px margin for grid visibility
            });

            // Draw Food
            ctx.fillStyle = '#FF5722';
            ctx.fillRect(food.x, food.y, gridSize - 2, gridSize - 2);
        }

        function gameOver() {
            clearInterval(gameInterval);
            playTone(150, 0.4, 'sawtooth'); // Defeat sound effect
            
            menuTitle.textContent = "GAME OVER";
            startBtn.textContent = "RETRY";
            gameMenu.classList.remove('hidden');
        }

        // Handle Arrow keys and WASD inputs safely 
        window.addEventListener('keydown', e => {
            const key = e.key.toLowerCase();
            
            // Check current direction state to prevent running backward into yourself
            const goingUp = dy === -gridSize;
            const goingDown = dy === gridSize;
            const goingRight = dx === gridSize;
            const goingLeft = dx === -gridSize;

            if ((key === 'arrowup' || key === 'w') && !goingDown) {
                nextDirection = { x: 0, y: -gridSize };
            }
            if ((key === 'arrowdown' || key === 's') && !goingUp) {
                nextDirection = { x: 0, y: gridSize };
            }
            if ((key === 'arrowleft' || key === 'a') && !goingRight) {
                nextDirection = { x: -gridSize, y: 0 };
            }
            if ((key === 'arrowright' || key === 'd') && !goingLeft) {
                nextDirection = { x: gridSize, y: 0 };
            }
        });
    </script>
</body>
</html>
